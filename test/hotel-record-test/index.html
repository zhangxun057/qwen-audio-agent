<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>酒店记事 · 独立测试</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #182230;
      --muted: #6b7788;
      --line: #dfe5ec;
      --panel: #fff;
      --bg: #f5f7fa;
      --accent: #1f6feb;
      --accent-soft: #eaf2ff;
      --danger: #c0392b;
      font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: var(--bg); }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    .wrap { width: min(1180px, 100%); margin: 0 auto; padding: 24px 18px 44px; }
    header { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 20px; }
    h1 { margin: 0; font-size: 25px; letter-spacing: .01em; }
    .sub { margin-top: 7px; color: var(--muted); font-size: 13px; }
    .badge { padding: 7px 10px; border: 1px solid #cde0ff; border-radius: 999px; color: #245eaf; background: var(--accent-soft); font-size: 12px; white-space: nowrap; }
    .grid { display: grid; grid-template-columns: minmax(320px, 430px) minmax(0, 1fr); gap: 16px; align-items: start; }
    .panel { padding: 18px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); box-shadow: 0 5px 20px #27364b0b; }
    .panel + .panel { margin-top: 14px; }
    h2 { margin: 0 0 14px; font-size: 16px; }
    label { display: block; margin: 11px 0 5px; color: #445064; font-size: 12px; font-weight: 600; }
    input, textarea, select { width: 100%; padding: 9px 10px; border: 1px solid #cfd7e1; border-radius: 8px; color: var(--ink); background: #fff; outline: none; }
    input:focus, textarea:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px #1f6feb18; }
    textarea { min-height: 78px; resize: vertical; line-height: 1.5; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
    .row.three { grid-template-columns: 1.3fr .8fr .8fr; }
    .hint { margin-top: 5px; color: var(--muted); font-size: 11px; line-height: 1.5; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 15px; }
    button { padding: 9px 13px; border: 1px solid #c8d2de; border-radius: 8px; color: #334155; background: #fff; }
    button.primary { border-color: var(--accent); color: #fff; background: var(--accent); }
    button.danger { color: var(--danger); border-color: #efc6c1; background: #fff8f7; }
    button.ghost { border-color: transparent; color: #54709a; background: transparent; }
    button:disabled { cursor: not-allowed; opacity: .5; }
    .presets { display: flex; flex-wrap: wrap; gap: 6px; }
    .presets button { padding: 6px 9px; color: #315985; background: #f3f7fc; font-size: 12px; }
    .status { min-height: 22px; margin-top: 10px; color: #18794e; font-size: 12px; line-height: 1.5; }
    .status.error { color: var(--danger); }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; }
    .toolbar .field { min-width: 130px; flex: 1; }
    .toolbar label { margin-top: 0; }
    .records { margin-top: 14px; overflow: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { padding: 10px 8px; border-bottom: 1px solid #edf0f4; text-align: left; vertical-align: top; }
    th { color: #607087; font-weight: 600; white-space: nowrap; }
    td.content { min-width: 250px; line-height: 1.55; }
    td small { display: block; margin-top: 3px; color: var(--muted); }
    .empty { padding: 28px 8px; color: var(--muted); text-align: center; }
    details { margin-top: 14px; color: var(--muted); font-size: 12px; }
    pre { max-height: 260px; overflow: auto; padding: 10px; border-radius: 8px; background: #f5f7fa; color: #455468; font-size: 11px; white-space: pre-wrap; word-break: break-word; }
    @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } header { display: block; } .badge { display: inline-block; margin-top: 10px; } }
    @media (max-width: 480px) { .row, .row.three { grid-template-columns: 1fr; } .wrap { padding-inline: 12px; } }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div>
        <h1>酒店记事 · 独立测试</h1>
        <div class="sub">测试真实的记录规范、实体关联、查询和修改；不接语音，不接任务，不连远程环境。</div>
      </div>
      <div class="badge" id="health">正在连接本地接口…</div>
    </header>

    <div class="grid">
      <section>
        <div class="panel">
          <h2>新增一条记事</h2>
          <div class="presets" aria-label="示例">
            <button type="button" data-preset="water">2015房送两瓶水</button>
            <button type="button" data-preset="loan">1015房借充电宝</button>
            <button type="button" data-preset="found">18楼电梯口捡皮鞋</button>
            <button type="button" data-preset="complaint">携程订单投诉空调</button>
          </div>
          <div class="row">
            <div>
              <label for="category">记录类别</label>
              <select id="category">
                <option>物品</option>
                <option>客人</option>
                <option>酒店</option>
                <option>其他</option>
              </select>
            </div>
            <div>
              <label for="action">具体动作</label>
              <input id="action" placeholder="例如：借出、补入、投诉、拾获">
            </div>
          </div>
          <label for="content">事实内容（必填）</label>
          <textarea id="content" placeholder="写成脱离当前对话也能看懂的一句话，例如：2015房补入矿泉水2瓶。"></textarea>
          <div class="row three">
            <div>
              <label for="item">物品（可选）</label>
              <input id="item" placeholder="矿泉水、充电宝、皮鞋">
            </div>
            <div>
              <label for="quantity">数量</label>
              <input id="quantity" inputmode="decimal" placeholder="2">
            </div>
            <div>
              <label for="unit">单位</label>
              <input id="unit" placeholder="瓶、个、把">
            </div>
          </div>
          <div class="row">
            <div>
              <label for="room">房间（可选）</label>
              <input id="room" placeholder="2015 或 2015房">
            </div>
            <div>
              <label for="guest">客人/订单线索（可选）</label>
              <input id="guest" placeholder="张先生、携程订单">
            </div>
          </div>
          <label for="location">地点（可选）</label>
          <input id="location" placeholder="18楼电梯门口、前台">
          <label for="details">补充说明（可选）</label>
          <input id="details" placeholder="例如：黑色、左脚鞋；不确定原因不要自行填写">
          <div class="hint">房号、物品和地点会由本地原子空间解析；未预设的物品或开放地点也允许记录，不会因为没有目录而失败。</div>
          <div class="actions">
            <button class="primary" id="write" type="button">保存记事</button>
            <button class="ghost" id="clear" type="button">清空</button>
          </div>
          <div id="writeStatus" class="status" role="status"></div>
        </div>

        <div class="panel">
          <h2>修改或删除</h2>
          <label for="recordId">记录编号</label>
          <input id="recordId" placeholder="从右侧记录行点击“选中”自动带入">
          <label for="newContent">改成的事实内容</label>
          <textarea id="newContent" placeholder="修改后的一句话；原有数量和实体关联会一并保留"></textarea>
          <div class="actions">
            <button class="primary" id="update" type="button">修改并保留关联</button>
            <button class="danger" id="delete" type="button">删除记录</button>
          </div>
          <div id="correctStatus" class="status" role="status"></div>
        </div>
      </section>

      <section>
        <div class="panel">
          <h2>查询已保存记事</h2>
          <div class="toolbar">
            <div class="field"><label for="queryKeyword">关键词</label><input id="queryKeyword" placeholder="水、投诉、皮鞋"></div>
            <div class="field"><label for="queryRoom">房间</label><input id="queryRoom" placeholder="2015"></div>
            <div class="field"><label for="queryCategory">类别</label><select id="queryCategory"><option value="">全部</option><option>物品</option><option>客人</option><option>酒店</option><option>其他</option></select></div>
            <button class="primary" id="query" type="button">查询</button>
          </div>
          <div id="records" class="records"><div class="empty">还没有记录</div></div>
        </div>
        <div class="panel">
          <h2>本地测试说明</h2>
          <div class="hint">这页直接调用项目里的原子空间 Mock 和本地记录存储，检验的是“写什么、如何关联、能否查到、能否改正”。它不模拟快模型的自然语言理解，所以不会把模型误判混进测试结果。</div>
          <details>
            <summary>查看当前索引（只读）</summary>
            <pre id="indexPreview">加载中…</pre>
          </details>
          <details>
            <summary>查看最近一次接口返回</summary>
            <pre id="lastResponse">暂无</pre>
          </details>
        </div>
      </section>
    </div>
  </main>
  <script>
    const $ = id => document.getElementById(id)
    const state = { records: [] }
    const presetData = {
      water: { category: '物品', action: '补入', content: '2015房补入矿泉水2瓶。', item: '矿泉水', quantity: '2', unit: '瓶', room: '2015' },
      loan: { category: '物品', action: '借出', content: '1015房借出充电宝1个。', item: '充电宝', quantity: '1', unit: '个', room: '1015' },
      found: { category: '物品', action: '拾获', content: '在18楼电梯门口拾获一双黑色皮鞋。', item: '皮鞋', quantity: '1', unit: '双', location: '18楼电梯门口', details: '黑色，一双' },
      complaint: { category: '客人', action: '投诉', content: '携程订单客人投诉房间空调坏了。', room: '2015', guest: '携程订单', details: '空调无法正常制冷' },
    }
    function fill(data) {
      for (const [key, value] of Object.entries(data)) if ($(key)) $(key).value = value
      $('writeStatus').textContent = ''
      $('writeStatus').className = 'status'
    }
    function showResponse(value) { $('lastResponse').textContent = JSON.stringify(value, null, 2) }
    function setStatus(id, message, error = false) { $(id).textContent = message; $(id).className = `status${error ? ' error' : ''}` }
    async function api(path, options) {
      const response = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...options })
      const data = await response.json().catch(() => ({ status: 'error', message: '接口没有返回 JSON' }))
      showResponse(data)
      if (!response.ok || data.status === 'error') throw new Error(data.message || `请求失败（${response.status}）`)
      return data
    }
    function formPayload() {
      const facts = {}
      if ($('item').value.trim()) facts.itemName = $('item').value.trim()
      if ($('quantity').value.trim()) facts.quantity = Number($('quantity').value)
      if ($('unit').value.trim()) facts.unit = $('unit').value.trim()
      if ($('location').value.trim()) facts.location = $('location').value.trim()
      const entities = []
      if ($('room').value.trim()) entities.push({ type: 'room', id: $('room').value.trim(), role: $('action').value.trim() === '投诉' ? 'complainant' : 'room' })
      if ($('guest').value.trim()) entities.push({ type: 'guest', id: $('guest').value.trim(), role: 'complainant' })
      return { category: $('category').value, action: $('action').value.trim(), content: $('content').value.trim(), facts, entities, details: $('details').value.trim() }
    }
    function renderRecords(records) {
      state.records = records || []
      if (!state.records.length) { $('records').innerHTML = '<div class="empty">没有符合条件的记录</div>'; return }
      const rows = state.records.map(record => {
        const entities = (record.entities || []).map(entity => `${entity.type}:${entity.id}`).join('、') || '—'
        const time = record.occurredAt ? new Date(record.occurredAt).toLocaleString('zh-CN', { hour12: false }) : '—'
        return `<tr><td>${escapeHtml(record.category || '')}<small>${escapeHtml(record.action || '')}</small></td><td class="content">${escapeHtml(record.content || '')}<small>${escapeHtml(entities)}</small></td><td>${escapeHtml(time)}</td><td><button type="button" data-select="${escapeHtml(record.recordId)}">选中</button></td></tr>`
      }).join('')
      $('records').innerHTML = `<table><thead><tr><th>类别</th><th>事实内容与关联</th><th>发生时间</th><th></th></tr></thead><tbody>${rows}</tbody></table>`
      $('records').querySelectorAll('[data-select]').forEach(button => button.addEventListener('click', () => {
        const record = state.records.find(item => item.recordId === button.dataset.select)
        if (!record) return
        $('recordId').value = record.recordId
        $('newContent').value = record.content || ''
        $('correctStatus').textContent = '已选中这条记录，可以修改或删除。'
        $('correctStatus').className = 'status'
      }))
    }
    function escapeHtml(value) { return String(value || '').replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char]) }
    async function loadRecords() {
      const params = new URLSearchParams()
      if ($('queryKeyword').value.trim()) params.set('keyword', $('queryKeyword').value.trim())
      if ($('queryRoom').value.trim()) { params.set('objectType', 'room'); params.set('objectId', $('queryRoom').value.trim()) }
      if ($('queryCategory').value) params.set('category', $('queryCategory').value)
      params.set('limit', '50')
      try { const data = await api(`/api/records?${params}`); renderRecords(data.records) } catch (error) { setStatus('correctStatus', error.message, true) }
    }
    document.querySelectorAll('[data-preset]').forEach(button => button.addEventListener('click', () => fill(presetData[button.dataset.preset])))
    $('write').addEventListener('click', async () => {
      const payload = formPayload()
      if (!payload.content) { setStatus('writeStatus', '请先写事实内容。', true); return }
      try {
        const data = await api('/api/records/write', { method: 'POST', body: JSON.stringify(payload) })
        setStatus('writeStatus', `已保存：${data.record.content}（${data.record.category}·${data.record.action || '记录'}）`)
        await loadRecords()
      } catch (error) { setStatus('writeStatus', error.message, true) }
    })
    $('clear').addEventListener('click', () => fill({ category: '物品', action: '', content: '', item: '', quantity: '', unit: '', room: '', guest: '', location: '', details: '' }))
    $('query').addEventListener('click', loadRecords)
    $('update').addEventListener('click', async () => {
      const recordId = $('recordId').value.trim(); const content = $('newContent').value.trim()
      if (!recordId || !content) { setStatus('correctStatus', '请选择记录并填写修改后的事实内容。', true); return }
      const current = state.records.find(item => item.recordId === recordId)
      if (!current) { setStatus('correctStatus', '没有找到这条记录，请先重新查询。', true); return }
      const replacement = {
        category: current.category,
        action: current.action,
        content,
        facts: current.facts,
        entities: current.entities,
        details: current.details,
        status: current.status,
        occurredAt: current.occurredAt,
      }
      try { const data = await api('/api/records/correct', { method: 'POST', body: JSON.stringify({ recordId, action: 'rewrite', replacement }) }); setStatus('correctStatus', `已修改：${data.record.content}`); await loadRecords() } catch (error) { setStatus('correctStatus', error.message, true) }
    })
    $('delete').addEventListener('click', async () => {
      const recordId = $('recordId').value.trim()
      if (!recordId) { setStatus('correctStatus', '请选择要删除的记录。', true); return }
      if (!window.confirm('确定删除这条记录吗？删除后默认查询不再显示。')) return
      try { const data = await api('/api/records/correct', { method: 'POST', body: JSON.stringify({ recordId, action: 'delete', reason: '独立测试删除' }) }); setStatus('correctStatus', `已删除：${data.record.recordId}`); await loadRecords() } catch (error) { setStatus('correctStatus', error.message, true) }
    })
    async function boot() {
      try {
        const health = await api('/api/health')
        $('health').textContent = '本地记事接口已连接'
        const index = await api('/api/index')
        $('indexPreview').textContent = JSON.stringify(index.index, null, 2)
        await loadRecords()
      } catch (error) { $('health').textContent = '本地接口连接失败'; $('health').style.color = '#c0392b'; setStatus('writeStatus', error.message, true) }
    }
    boot()
  </script>
</body>
</html>
